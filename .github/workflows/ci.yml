name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ${{ secrets.DB_USER }}
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
          POSTGRES_DB: antcollect_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run Alembic migrations
        run: DB_NAME=antcollect_test alembic upgrade head
        env:
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_HOST: localhost
          DB_PORT: 5432

      - name: Run pytest
        run: pytest
        env:
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: antcollect_test
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_S3_BUCKET: test-bucket
          AWS_REGION: us-east-1
          S3_MOCK: "true"

  messaging:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ${{ secrets.MESSAGING_DB_USER }}
          POSTGRES_PASSWORD: ${{ secrets.MESSAGING_DB_PASSWORD }}
          POSTGRES_DB: antcollect_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: Run tests
        run: mvn test -Dspring.profiles.active=test
        working-directory: messaging-service
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          MESSAGING_DB_USER: ${{ secrets.MESSAGING_DB_USER }}
          MESSAGING_DB_PASSWORD: ${{ secrets.MESSAGING_DB_PASSWORD }}

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Run tests
        run: npx vitest run
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, messaging, frontend]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ${{ secrets.DB_USER }}
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
          POSTGRES_DB: antcollect_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4

      # ── Python / FastAPI ──────────────────────────────────────────────────
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      # ── Java / Spring Boot ────────────────────────────────────────────────
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      # ── Node / Frontend ───────────────────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      # ── Database setup ────────────────────────────────────────────────────
      - name: Create messaging DB user
        run: |
          PGPASSWORD=${{ secrets.DB_PASSWORD }} psql -h localhost -U ${{ secrets.DB_USER }} -d postgres \
            -c "CREATE USER ${{ secrets.MESSAGING_DB_USER }} WITH SUPERUSER PASSWORD '${{ secrets.MESSAGING_DB_PASSWORD }}';"
        # SUPERUSER is safe here — this is a throwaway CI container.
        # It lets Flyway create the petrcollect_messaging schema without extra grants.

      - name: Run Alembic migrations
        run: DB_NAME=antcollect_test alembic upgrade head
        env:
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_HOST: localhost
          DB_PORT: 5432

      - name: Grant cross-schema read to messaging user
        run: |
          PGPASSWORD=${{ secrets.DB_PASSWORD }} psql -h localhost -U ${{ secrets.DB_USER }} \
            -d antcollect_test \
            -c "GRANT SELECT ON public.users TO ${{ secrets.MESSAGING_DB_USER }};"
        # Mirrors the production grant documented in DB_SETUP.md step 7.

      # ── Start services ────────────────────────────────────────────────────
      - name: Start FastAPI
        run: uvicorn backend.main:app --port 8000 &
        env:
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: antcollect_test
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          INTERNAL_SERVICE_SECRET: ${{ secrets.INTERNAL_SERVICE_SECRET }}
          # S3 credentials — point at the dedicated test bucket (AWS_S3_BUCKET
          # should be set to a separate bucket or path prefix from production
          # so CI uploads don't pollute prod data).
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          AWS_REGION: ${{ secrets.AWS_REGION }}

      - name: Start messaging service
        run: mvn spring-boot:run -Dspring-boot.run.profiles=test > /tmp/messaging.log 2>&1 &
        working-directory: messaging-service
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          MESSAGING_DB_USER: ${{ secrets.MESSAGING_DB_USER }}
          MESSAGING_DB_PASSWORD: ${{ secrets.MESSAGING_DB_PASSWORD }}
          INTERNAL_SERVICE_SECRET: ${{ secrets.INTERNAL_SERVICE_SECRET }}

      - name: Start Vite dev server
        run: npm run dev &
        working-directory: frontend

      # ── Wait for all three services ───────────────────────────────────────
      - name: Wait for FastAPI
        run: timeout 60 bash -c 'until curl -sf http://localhost:8000/health; do sleep 2; done'

      - name: Wait for messaging service
        run: timeout 300 bash -c 'until nc -z localhost 8080; do sleep 10; done'

      - name: Dump messaging log on failure
        if: failure()
        run: cat /tmp/messaging.log || true

      - name: Wait for Vite
        run: timeout 60 bash -c 'until curl -sf http://localhost:5173/; do sleep 2; done'

      # ── Seed test users ───────────────────────────────────────────────────
      - name: Seed test users
        env:
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
          TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
          TEST_OTHER_USERNAME: ${{ secrets.TEST_OTHER_USERNAME }}
          TEST_OTHER_PASSWORD: ${{ secrets.TEST_OTHER_PASSWORD }}
        run: |
          curl -sf -X POST http://localhost:8000/users/create-user \
            -H "Content-Type: application/json" \
            -d "{\"username\":\"$TEST_USERNAME\",\"email\":\"$TEST_USER_EMAIL\",\"password\":\"$TEST_USER_PASSWORD\"}"
          curl -sf -X POST http://localhost:8000/users/create-user \
            -H "Content-Type: application/json" \
            -d "{\"username\":\"$TEST_OTHER_USERNAME\",\"email\":\"ci_other@test.internal\",\"password\":\"$TEST_OTHER_PASSWORD\"}"

      # ── Playwright ────────────────────────────────────────────────────────
      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps
        working-directory: frontend

      - name: Run E2E tests
        run: npx playwright test --config=e2e/playwright.config.ts
        working-directory: frontend
        env:
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
          TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
          TEST_OTHER_USERNAME: ${{ secrets.TEST_OTHER_USERNAME }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          AWS_REGION: ${{ secrets.AWS_REGION }}

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/

  deploy:
    runs-on: ubuntu-latest
    needs: [e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      # ── Build the Spring Boot JAR here (7 GB RAM runner, not on EC2) ────────
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: Package messaging JAR
        run: mvn package -DskipTests -q
        working-directory: messaging-service

      # ── Copy the finished JAR to EC2 before SSH ──────────────────────────────
      - name: Copy JAR to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "messaging-service/target/messaging-service-*.jar"
          target: "/opt/petrcollect/"
          strip_components: 2

      # ── Pull Python code + restart services (no compiler needed on EC2) ──────
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /opt/petrcollect
            git pull origin main

            # Python: sync any new dependencies then migrate
            source .venv/bin/activate
            pip install -q -r backend/requirements.txt
            alembic upgrade head
            deactivate

            # Restart FastAPI (no compile step — Python runs from source)
            sudo systemctl restart petrcollect-api
            sudo systemctl is-active --quiet petrcollect-api || exit 1

            # Point the stable symlink at whichever versioned JAR was just copied
            JAR=$(find /opt/petrcollect -maxdepth 1 -name 'messaging-service-*.jar' \
                  ! -name '*.jar.original' | sort | tail -1)
            ln -sf "$JAR" /opt/petrcollect/messaging.jar

            # Restart messaging (Flyway runs on startup; JAR already on disk)
            sudo systemctl restart petrcollect-messaging
            sudo systemctl is-active --quiet petrcollect-messaging || exit 1

            # Reload nginx config (not restart — zero downtime)
            sudo systemctl reload nginx

      - name: Post-deploy health check
        run: |
          sleep 10
          curl -sf https://${{ secrets.PROD_DOMAIN }}/api/health || exit 1
