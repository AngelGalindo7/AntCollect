name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ${{ secrets.DB_USER }}
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
          POSTGRES_DB: antcollect_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run Alembic migrations
        run: |
          PGPASSWORD=${{ secrets.DB_PASSWORD }} psql -h localhost -U ${{ secrets.DB_USER }} -d antcollect_test -c "CREATE EXTENSION IF NOT EXISTS pg_trgm;"
          PGPASSWORD=${{ secrets.DB_PASSWORD }} psql -h localhost -U ${{ secrets.DB_USER }} -d antcollect_test -c "CREATE EXTENSION IF NOT EXISTS vector;"
          DB_NAME=antcollect_test alembic upgrade head
        env:
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_HOST: localhost
          DB_PORT: 5432
          CLOUDFRONT_DOMAIN: ${{ secrets.CLOUDFRONT_DOMAIN }}

      - name: Run pytest
        run: pytest
        env:
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: antcollect_test
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_S3_BUCKET: test-bucket
          AWS_REGION: us-east-1
          S3_MOCK: "true"
          FRONTEND_URL: "http://localhost:5173"

  messaging:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ${{ secrets.MESSAGING_DB_USER }}
          POSTGRES_PASSWORD: ${{ secrets.MESSAGING_DB_PASSWORD }}
          POSTGRES_DB: antcollect_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: Run tests
        run: mvn test -Dspring.profiles.active=test
        working-directory: messaging-service
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          MESSAGING_DB_USER: ${{ secrets.MESSAGING_DB_USER }}
          MESSAGING_DB_PASSWORD: ${{ secrets.MESSAGING_DB_PASSWORD }}

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Run tests
        run: npx vitest run
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, messaging, frontend]
    permissions:
      id-token: write   # required for OIDC token exchange
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c # v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      # ── Build Docker images ───────────────────────────────────────────────
      # Images are built fresh from the current commit and loaded into the
      # local Docker daemon (never pushed to ECR). GHA layer caching means
      # only changed layers rebuild — warm runs for source-only changes take
      # ~60–90 s per image instead of a full cold build.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build backend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          load: true
          tags: petrcollect-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build messaging image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: messaging-service/Dockerfile
          push: false
          load: true
          tags: petrcollect-messaging:ci
          cache-from: type=gha,scope=messaging
          cache-to: type=gha,mode=max,scope=messaging

      # ── Python for Alembic ────────────────────────────────────────────────
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      # ── Node for Playwright + Vite ────────────────────────────────────────
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      # ── Start postgres ────────────────────────────────────────────────────
      - name: Start postgres
        run: docker compose -f docker-compose.ci.yml up -d postgres
        env:
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

      - name: Wait for postgres
        run: timeout 60 bash -c 'until docker compose -f docker-compose.ci.yml exec -T postgres pg_isready; do sleep 2; done'

      # ── Database setup ────────────────────────────────────────────────────
      - name: Create messaging DB user
        run: |
          PGPASSWORD=${{ secrets.DB_PASSWORD }} psql -h localhost -U ${{ secrets.DB_USER }} -d postgres \
            -c "CREATE USER ${{ secrets.MESSAGING_DB_USER }} WITH SUPERUSER PASSWORD '${{ secrets.MESSAGING_DB_PASSWORD }}';"
        # SUPERUSER is safe here — this is a throwaway CI container.
        # It lets Flyway create the petrcollect_messaging schema without extra grants.

      - name: Run Alembic migrations
        run: |
          PGPASSWORD=${{ secrets.DB_PASSWORD }} psql -h localhost -U ${{ secrets.DB_USER }} -d antcollect_test -c "CREATE EXTENSION IF NOT EXISTS pg_trgm;"
          PGPASSWORD=${{ secrets.DB_PASSWORD }} psql -h localhost -U ${{ secrets.DB_USER }} -d antcollect_test -c "CREATE EXTENSION IF NOT EXISTS vector;"
          DB_NAME=antcollect_test alembic upgrade head
        env:
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_HOST: localhost
          DB_PORT: 5432
          CLOUDFRONT_DOMAIN: ${{ secrets.CLOUDFRONT_DOMAIN }}

      - name: Grant cross-schema read to messaging user
        run: |
          PGPASSWORD=${{ secrets.DB_PASSWORD }} psql -h localhost -U ${{ secrets.DB_USER }} \
            -d antcollect_test \
            -c "GRANT SELECT ON public.users TO ${{ secrets.MESSAGING_DB_USER }};"
        # Mirrors the production grant documented in DB_SETUP.md step 7.

      # ── Start backend and messaging ───────────────────────────────────────
      # DB setup must complete before these start — Flyway (messaging) and
      # the backend both expect the schema and users to already exist.
      - name: Start backend and messaging services
        run: docker compose -f docker-compose.ci.yml up -d backend messaging
        env:
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          MESSAGING_DB_USER: ${{ secrets.MESSAGING_DB_USER }}
          MESSAGING_DB_PASSWORD: ${{ secrets.MESSAGING_DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          INTERNAL_SERVICE_SECRET: ${{ secrets.INTERNAL_SERVICE_SECRET }}
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          CLOUDFRONT_DOMAIN: ${{ secrets.CLOUDFRONT_DOMAIN }}
          ALLOWED_ORIGINS: http://localhost:5173

      # ── Start Vite ────────────────────────────────────────────────────────
      # Frontend has no Dockerfile and deploys to Vercel, not Docker.
      # Vite dev server is the correct E2E target here.
      - name: Start Vite dev server
        run: npm run dev &
        working-directory: frontend

      # ── Wait for all three services ───────────────────────────────────────
      - name: Wait for FastAPI
        run: timeout 60 bash -c 'until curl -sf http://localhost:8000/health; do sleep 2; done'

      - name: Wait for messaging service
        run: timeout 120 bash -c 'until nc -z localhost 8080; do sleep 5; done'

      - name: Wait for Vite
        run: timeout 60 bash -c 'until curl -sf http://localhost:5173/; do sleep 2; done'

      # ── Seed test users ───────────────────────────────────────────────────
      - name: Seed test users
        env:
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
          TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
          TEST_OTHER_USERNAME: ${{ secrets.TEST_OTHER_USERNAME }}
          TEST_OTHER_EMAIL: ${{ secrets.TEST_OTHER_EMAIL }}
          TEST_OTHER_PASSWORD: ${{ secrets.TEST_OTHER_PASSWORD }}
        run: |
          curl -s --fail-with-body -X POST http://localhost:8000/users/create-user \
            -H "Content-Type: application/json" \
            -d "{\"username\":\"$TEST_USERNAME\",\"email\":\"$TEST_USER_EMAIL\",\"password\":\"$TEST_USER_PASSWORD\"}"
          curl -s --fail-with-body -X POST http://localhost:8000/users/create-user \
            -H "Content-Type: application/json" \
            -d "{\"username\":\"$TEST_OTHER_USERNAME\",\"email\":\"$TEST_OTHER_EMAIL\",\"password\":\"$TEST_OTHER_PASSWORD\"}"

      - name: Dump service logs on failure
        if: failure()
        run: docker compose -f docker-compose.ci.yml logs

      # ── Playwright ────────────────────────────────────────────────────────
      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps
        working-directory: frontend

      - name: Run E2E tests
        run: npx playwright test --config=e2e/playwright.config.ts
        working-directory: frontend
        env:
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
          TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
          TEST_OTHER_USERNAME: ${{ secrets.TEST_OTHER_USERNAME }}
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          AWS_REGION: ${{ secrets.AWS_REGION }}

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
