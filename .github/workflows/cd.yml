name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      id-token: write   # Required for OIDC role assumption
      contents: read
    steps:
      - uses: actions/checkout@v4

      # ── Configure AWS credentials via OIDC ──────────────────────────────
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      # ── Login to Amazon ECR ──────────────────────────────────────────────
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ── Build & Push Backend ─────────────────────────────────────────────
      - name: Build and push Backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/petrcollect-backend:latest

      # ── Build & Push Messaging ──────────────────────────────────────────
      - name: Build and push Messaging
        uses: docker/build-push-action@v6
        with:
          context: .
          file: messaging-service/Dockerfile
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/petrcollect-messaging:latest

      # ── RDS Initialization (Admin via EC2) ──────────────────────────────
      # psql runs on EC2, which is inside the VPC and can reach the private RDS
      # endpoint. All role names are injected from secrets — nothing is hardcoded.
      # Prereq: postgresql-client must be installed on the EC2 instance.
      - name: Initialize RDS roles and schemas
        uses: appleboy/ssh-action@v1.0.3
        env:
          PGPASSWORD: ${{ secrets.RDS_ADMIN_PASSWORD }}
          RDS_HOST: ${{ secrets.RDS_HOST }}
          RDS_PORT: ${{ secrets.RDS_PORT }}
          RDS_ADMIN_USER: ${{ secrets.RDS_ADMIN_USER }}
          DB_NAME: ${{ secrets.DB_NAME }}
          APP_DB_USER: ${{ secrets.APP_DB_USER }}
          APP_DB_PASSWORD: ${{ secrets.APP_DB_PASSWORD }}
          MESSAGING_DB_USER: ${{ secrets.MESSAGING_DB_USER }}
          MESSAGING_DB_PASSWORD: ${{ secrets.MESSAGING_DB_PASSWORD }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: PGPASSWORD,RDS_HOST,RDS_PORT,RDS_ADMIN_USER,DB_NAME,APP_DB_USER,APP_DB_PASSWORD,MESSAGING_DB_USER,MESSAGING_DB_PASSWORD
          script: |
            psql \
              -h "$RDS_HOST" \
              -p "$RDS_PORT" \
              -U "$RDS_ADMIN_USER" \
              -d "$DB_NAME" \
              -c "DO \$\$ BEGIN IF NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = '${APP_DB_USER}') THEN CREATE ROLE ${APP_DB_USER} WITH LOGIN PASSWORD '${APP_DB_PASSWORD}'; END IF; END \$\$;" \
              -c "ALTER ROLE ${APP_DB_USER} SET search_path TO public;" \
              -c "GRANT ALL PRIVILEGES ON SCHEMA public TO ${APP_DB_USER};" \
              -c "DO \$\$ BEGIN IF NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = '${MESSAGING_DB_USER}') THEN CREATE ROLE ${MESSAGING_DB_USER} WITH LOGIN PASSWORD '${MESSAGING_DB_PASSWORD}'; END IF; END \$\$;" \
              -c "CREATE SCHEMA IF NOT EXISTS ${MESSAGING_DB_USER} AUTHORIZATION ${MESSAGING_DB_USER};" \
              -c "ALTER ROLE ${MESSAGING_DB_USER} SET search_path TO ${MESSAGING_DB_USER}, public;" \
              -c "GRANT ALL PRIVILEGES ON SCHEMA ${MESSAGING_DB_USER} TO ${MESSAGING_DB_USER};" \
              -c "GRANT USAGE ON SCHEMA public TO ${MESSAGING_DB_USER};"

      # ── Run Alembic Migrations (App User via EC2) ───────────────────────
      # docker run executes on EC2 so the container reaches RDS inside the VPC.
      # EC2 authenticates to ECR using its instance role — no long-lived keys needed.
      - name: Run Backend Migrations
        uses: appleboy/ssh-action@v1.0.3
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          APP_DB_USER: ${{ secrets.APP_DB_USER }}
          APP_DB_PASSWORD: ${{ secrets.APP_DB_PASSWORD }}
          RDS_HOST: ${{ secrets.RDS_HOST }}
          RDS_PORT: ${{ secrets.RDS_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: ECR_REGISTRY,AWS_REGION,APP_DB_USER,APP_DB_PASSWORD,RDS_HOST,RDS_PORT,DB_NAME
          script: |
            aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
            docker run --rm \
              -e DB_USER="$APP_DB_USER" \
              -e DB_PASSWORD="$APP_DB_PASSWORD" \
              -e DB_HOST="$RDS_HOST" \
              -e DB_PORT="$RDS_PORT" \
              -e DB_NAME="$DB_NAME" \
              "$ECR_REGISTRY/petrcollect-backend:latest" \
              alembic upgrade head

      # ── Cross-Schema Permissions (Admin via EC2) ────────────────────────
      # Grants messaging user read access to public.users.
      # Must run after Alembic has created the table.
      - name: Grant Cross-Schema Permissions
        uses: appleboy/ssh-action@v1.0.3
        env:
          PGPASSWORD: ${{ secrets.RDS_ADMIN_PASSWORD }}
          RDS_HOST: ${{ secrets.RDS_HOST }}
          RDS_PORT: ${{ secrets.RDS_PORT }}
          RDS_ADMIN_USER: ${{ secrets.RDS_ADMIN_USER }}
          DB_NAME: ${{ secrets.DB_NAME }}
          MESSAGING_DB_USER: ${{ secrets.MESSAGING_DB_USER }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: PGPASSWORD,RDS_HOST,RDS_PORT,RDS_ADMIN_USER,DB_NAME,MESSAGING_DB_USER
          script: |
            psql \
              -h "$RDS_HOST" \
              -p "$RDS_PORT" \
              -U "$RDS_ADMIN_USER" \
              -d "$DB_NAME" \
              -c "GRANT SELECT ON public.users TO ${MESSAGING_DB_USER};"

      # ── Prepare EC2 Directory ────────────────────────────────────────────
      - name: Prepare EC2 Directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: mkdir -p /opt/petrcollect

      # ── Create .env for EC2 ──────────────────────────────────────────────
      # RDS_ADMIN_PASSWORD is intentionally omitted — admin creds are only
      # needed for the one-time schema init steps above, not at runtime.
      - name: Create .env file for EC2
        run: |
          echo "ECR_REGISTRY=${{ steps.login-ecr.outputs.registry }}" > .env
          echo "DB_HOST=${{ secrets.RDS_HOST }}" >> .env
          echo "DB_PORT=${{ secrets.RDS_PORT }}" >> .env
          echo "DB_NAME=${{ secrets.DB_NAME }}" >> .env
          echo "APP_DB_USER=${{ secrets.APP_DB_USER }}" >> .env
          echo "APP_DB_PASSWORD=${{ secrets.APP_DB_PASSWORD }}" >> .env
          echo "MESSAGING_DB_USER=${{ secrets.MESSAGING_DB_USER }}" >> .env
          echo "MESSAGING_DB_PASSWORD=${{ secrets.MESSAGING_DB_PASSWORD }}" >> .env
          echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env
          echo "INTERNAL_SERVICE_SECRET=${{ secrets.INTERNAL_SERVICE_SECRET }}" >> .env
          echo "AWS_REGION=${{ secrets.AWS_REGION }}" >> .env
          echo "AWS_S3_BUCKET=${{ secrets.AWS_S3_BUCKET }}" >> .env
          echo "CLOUDFRONT_DOMAIN=${{ secrets.CLOUDFRONT_DOMAIN }}" >> .env
          echo "ALLOWED_ORIGINS=${{ secrets.ALLOWED_ORIGINS }}" >> .env

      # ── Copy configuration to EC2 ────────────────────────────────────────
      - name: Copy docker-compose and .env to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.prod.yml,.env"
          target: "/opt/petrcollect/"

      # ── Deploy to EC2 ────────────────────────────────────────────────────
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /opt/petrcollect

            # Login to ECR on EC2
            aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ steps.login-ecr.outputs.registry }}

            # Pull latest images
            docker pull ${{ steps.login-ecr.outputs.registry }}/petrcollect-backend:latest
            docker pull ${{ steps.login-ecr.outputs.registry }}/petrcollect-messaging:latest

            # Restart services
            docker-compose -f docker-compose.prod.yml up -d
