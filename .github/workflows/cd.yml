name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      id-token: write   # Required for OIDC role assumption
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # ── Configure AWS credentials via OIDC ──────────────────────────────
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c # v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      # ── Login to Amazon ECR ──────────────────────────────────────────────
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@f2e9fc6c2b355c1890b65e6f6f0e2ac3e6e22f78 # v2

      # ── Capture ECR token for EC2 SSH steps ─────────────────────────────
      # The runner has AWS credentials from OIDC; capturing the token here
      # means EC2 SSH steps can docker-login without needing aws CLI on EC2.
      - name: Get ECR login token
        id: ecr-token
        run: |
          PASSWORD=$(aws ecr get-login-password --region ${{ secrets.AWS_REGION }})
          echo "::add-mask::$PASSWORD"
          echo "password=$PASSWORD" >> $GITHUB_OUTPUT

      # ── Build & Push Backend ─────────────────────────────────────────────
      - name: Build and push Backend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/petrcollect-backend:latest

      # ── DECOMMISSIONED: Build & Push Messaging ──────────────────────────
      # Not deployed as of the 2026-07 rebuild. Restoring this also requires the
      # petrcollect-messaging ECR repository and the messaging service in
      # docker-compose.prod.yml. See docs/RECOMMISSION_TRADING_MESSAGING.md.
      #
      # - name: Build and push Messaging
      #   uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
      #   with:
      #     context: .
      #     file: messaging-service/Dockerfile
      #     push: true
      #     tags: ${{ steps.login-ecr.outputs.registry }}/petrcollect-messaging:latest

      # ── Create .env for EC2 ──────────────────────────────────────────────
      # TODO(security): migrate to AWS Secrets Manager
      # Current: secrets written to .env on EC2 disk (chmod 600)
      # See: docs/DECISION_LOG.md — Secrets Management Migration
      - name: Create .env file for EC2
        run: |
          echo "ECR_REGISTRY=${{ steps.login-ecr.outputs.registry }}" > .env
          echo "DB_NAME=${{ secrets.DB_NAME }}" >> .env
          echo "APP_DB_USER=${{ secrets.APP_DB_USER }}" >> .env
          echo "APP_DB_PASSWORD=${{ secrets.APP_DB_PASSWORD }}" >> .env
          echo "POSTGRES_ADMIN_USER=${{ secrets.POSTGRES_ADMIN_USER }}" >> .env
          echo "POSTGRES_ADMIN_PASSWORD=${{ secrets.POSTGRES_ADMIN_PASSWORD }}" >> .env
          echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env
          echo "AWS_REGION=${{ secrets.AWS_REGION }}" >> .env
          echo "AWS_S3_BUCKET=${{ secrets.AWS_S3_BUCKET }}" >> .env
          echo "CLOUDFRONT_DOMAIN=${{ secrets.CLOUDFRONT_DOMAIN }}" >> .env
          echo "REMOVE_BG_ALLOWED_HOSTS=${{ secrets.REMOVE_BG_ALLOWED_HOSTS }}" >> .env
          echo "ALLOWED_ORIGINS=${{ secrets.ALLOWED_ORIGINS }}" >> .env
          echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" >> .env
          echo "GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}" >> .env
          echo "GOOGLE_REDIRECT_URI=${{ secrets.GOOGLE_REDIRECT_URI }}" >> .env
          echo "COOKIE_SECURE=true" >> .env
          echo "COOKIE_DOMAIN=.petrcollect.com" >> .env

      # ── Prepare EC2 Directory ────────────────────────────────────────────
      - name: Prepare EC2 Directory
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: mkdir -p ~/petrcollect

      # ── Copy configuration to EC2 ────────────────────────────────────────
      - name: Copy docker-compose and .env to EC2
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634 # v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.prod.yml,.env"
          target: "~/petrcollect/"

      # ── Start the database first ─────────────────────────────────────────
      # Postgres runs on this box now rather than RDS, so it must be up and
      # passing its healthcheck before role init or migrations can run.
      # `--wait` blocks until the healthcheck succeeds, or fails the step.
      - name: Start database
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_PASSWORD: ${{ steps.ecr-token.outputs.password }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: ECR_REGISTRY,ECR_PASSWORD
          script: |
            set -euo pipefail
            chmod 600 ~/petrcollect/.env
            cd ~/petrcollect
            echo "$ECR_PASSWORD" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
            docker compose -f docker-compose.prod.yml up -d --wait db

      # ── Initialize roles and extensions ─────────────────────────────────
      # Runs inside the db container over the local socket (trust auth), so the
      # admin password never crosses the network. Creates the low-privilege app
      # role that Alembic and the backend connect as.
      #
      # :'varname' (psql quoted-literal substitution) only works at statement
      # level — psql disables it inside dollar-quoted DO blocks, so the password
      # is set via ALTER ROLE outside the block.
      - name: Initialize database roles and extensions
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        env:
          DB_NAME: ${{ secrets.DB_NAME }}
          POSTGRES_ADMIN_USER: ${{ secrets.POSTGRES_ADMIN_USER }}
          APP_DB_USER: ${{ secrets.APP_DB_USER }}
          APP_DB_PASSWORD: ${{ secrets.APP_DB_PASSWORD }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DB_NAME,POSTGRES_ADMIN_USER,APP_DB_USER,APP_DB_PASSWORD
          script: |
            set -euo pipefail
            cd ~/petrcollect
            docker compose -f docker-compose.prod.yml exec -T db \
              psql -U "$POSTGRES_ADMIN_USER" -d "$DB_NAME" \
              -v ON_ERROR_STOP=1 \
              -v app_pw="$APP_DB_PASSWORD" \
              << EOSQL
            DO \$\$ BEGIN
              IF NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = '${APP_DB_USER}') THEN
                CREATE ROLE ${APP_DB_USER} WITH LOGIN;
              END IF;
            END \$\$;
            ALTER ROLE ${APP_DB_USER} WITH PASSWORD :'app_pw';
            ALTER ROLE ${APP_DB_USER} SET search_path TO public;
            GRANT ALL PRIVILEGES ON SCHEMA public TO ${APP_DB_USER};
            CREATE EXTENSION IF NOT EXISTS pg_trgm;
            CREATE EXTENSION IF NOT EXISTS vector;
            EOSQL

      # ── Run Alembic Migrations ──────────────────────────────────────────
      # --network petrcollect_default is required: a bare `docker run` lands on
      # the default bridge network and cannot resolve the `db` service name.
      # The project name is pinned in docker-compose.prod.yml so this network
      # name is deterministic.
      #
      # TODO(follow-up): add downgrade round-trip test in CI before promoting:
      #   alembic upgrade head && alembic downgrade -1 && alembic upgrade head
      - name: Validate pending migrations
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          APP_DB_USER: ${{ secrets.APP_DB_USER }}
          APP_DB_PASSWORD: ${{ secrets.APP_DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: ECR_REGISTRY,APP_DB_USER,APP_DB_PASSWORD,DB_NAME
          script: |
            docker run --rm \
              --network petrcollect_default \
              -e DB_USER="$APP_DB_USER" \
              -e DB_PASSWORD="$APP_DB_PASSWORD" \
              -e DB_HOST=db \
              -e DB_PORT=5432 \
              -e DB_NAME="$DB_NAME" \
              "$ECR_REGISTRY/petrcollect-backend:latest" \
              bash -euo pipefail -c '
                set -euo pipefail

                # Pending = revisions strictly between the DB''s applied state and the script head.
                CURRENT=$(alembic current 2>/dev/null | awk "/^[a-f0-9]+/ {print \$1; exit}")
                HEAD=$(alembic heads 2>/dev/null   | awk "/^[a-f0-9]+/ {print \$1; exit}")

                if [ -z "$HEAD" ]; then
                  echo "Could not determine head revision — aborting."
                  exit 1
                fi

                if [ "$CURRENT" = "$HEAD" ]; then
                  echo "No pending migrations — pre-flight check passed."
                  exit 0
                fi

                PENDING=$(alembic history -r "${CURRENT:-base}:$HEAD" 2>/dev/null \
                  | grep -oE "-> [a-f0-9]+" | awk "{print \$2}" || true)

                if [ -z "$PENDING" ]; then
                  echo "No pending migrations — pre-flight check passed."
                  exit 0
                fi

                FAILED=0
                for REV in $PENDING; do
                  FILE=$(find alembic/versions -maxdepth 1 -name "${REV}_*.py" 2>/dev/null | head -1)
                  if [ -z "$FILE" ]; then
                    echo "WARNING: migration file for revision $REV not found in alembic/versions/"
                    continue
                  fi

                  # Non-concurrent index creation locks the table for the full build duration.
                  if grep -qiE "create_index\b" "$FILE" && ! grep -qiE "postgresql_concurrently\s*=\s*True" "$FILE"; then
                    echo "ERROR: $FILE — create_index() without postgresql_concurrently=True locks the table in production."
                    FAILED=1
                  fi

                  # DML without a WHERE clause risks a full-table write (large backfill = long lock).
                  if grep -qiE "^\s*(op\.execute|connection\.execute).*\b(UPDATE|DELETE)\b" "$FILE" \
                     && ! grep -qiE "\bWHERE\b" "$FILE"; then
                    echo "ERROR: $FILE — UPDATE or DELETE without a WHERE clause detected."
                    FAILED=1
                  fi

                  # Adding a NOT NULL column without a server-side default locks the table for a rewrite.
                  if grep -qiE "add_column" "$FILE" \
                     && grep -qiE "nullable\s*=\s*False" "$FILE" \
                     && ! grep -qiE "server_default" "$FILE"; then
                    echo "ERROR: $FILE — NOT NULL column added without server_default; locks table on large datasets."
                    FAILED=1
                  fi
                done

                if [ "$FAILED" -ne 0 ]; then
                  echo "Migration pre-flight check FAILED — aborting deployment."
                  exit 1
                fi

                echo "Migration pre-flight check passed."
              '

      - name: Run Backend Migrations
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          APP_DB_USER: ${{ secrets.APP_DB_USER }}
          APP_DB_PASSWORD: ${{ secrets.APP_DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: ECR_REGISTRY,APP_DB_USER,APP_DB_PASSWORD,DB_NAME
          script: |
            docker run --rm \
              --network petrcollect_default \
              -e DB_USER="$APP_DB_USER" \
              -e DB_PASSWORD="$APP_DB_PASSWORD" \
              -e DB_HOST=db \
              -e DB_PORT=5432 \
              -e DB_NAME="$DB_NAME" \
              "$ECR_REGISTRY/petrcollect-backend:latest" \
              alembic upgrade head

      # ── DECOMMISSIONED: cross-schema permissions ────────────────────────
      # Granted the messaging role SELECT on public.users. Restore alongside the
      # messaging service. See docs/RECOMMISSION_TRADING_MESSAGING.md.
      #
      # - name: Grant Cross-Schema Permissions
      #   uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
      #   script: |
      #     docker compose -f docker-compose.prod.yml exec -T db \
      #       psql -U "$POSTGRES_ADMIN_USER" -d "$DB_NAME" \
      #       -c "GRANT SELECT ON public.users TO ${MESSAGING_DB_USER};"

      # ── Deploy backend ───────────────────────────────────────────────────
      - name: Deploy backend to EC2
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_PASSWORD: ${{ steps.ecr-token.outputs.password }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: ECR_REGISTRY,ECR_PASSWORD
          script: |
            set -euo pipefail
            cd ~/petrcollect
            echo "$ECR_PASSWORD" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
            docker pull "$ECR_REGISTRY/petrcollect-backend:latest"

            # --force-recreate ensures the freshly pulled image is used even
            # though the :latest tag is unchanged. Only the backend is
            # recreated — restarting db here would drop connections for nothing.
            docker compose -f docker-compose.prod.yml up -d --force-recreate backend

            # Remove images no longer referenced by any container to prevent
            # disk exhaustion. || true: a concurrent prune must not fail the
            # pipeline — containers are already running at this point.
            docker image prune -a -f || true
