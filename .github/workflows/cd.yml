name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      id-token: write   # Required for OIDC role assumption
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # ── Configure AWS credentials via OIDC ──────────────────────────────
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c # v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      # ── Login to Amazon ECR ──────────────────────────────────────────────
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@f2e9fc6c2b355c1890b65e6f6f0e2ac3e6e22f78 # v2

      # ── Capture ECR token for EC2 SSH steps ─────────────────────────────
      # The runner has AWS credentials from OIDC; capturing the token here
      # means EC2 SSH steps can docker-login without needing aws CLI on EC2.
      - name: Get ECR login token
        id: ecr-token
        run: |
          PASSWORD=$(aws ecr get-login-password --region ${{ secrets.AWS_REGION }})
          echo "::add-mask::$PASSWORD"
          echo "password=$PASSWORD" >> $GITHUB_OUTPUT

      # ── Build & Push Backend ─────────────────────────────────────────────
      - name: Build and push Backend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/petrcollect-backend:latest

      # ── Build & Push Messaging ──────────────────────────────────────────
      - name: Build and push Messaging
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: messaging-service/Dockerfile
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/petrcollect-messaging:latest

      # ── RDS Initialization (Admin via EC2) ──────────────────────────────
      # psql runs on EC2, which is inside the VPC and can reach the private RDS
      # endpoint. All role names are injected from secrets — nothing is hardcoded.
      # Prereq: postgresql-client must be installed on the EC2 instance.
      #
      # set -euo pipefail: catches empty/unset secrets before they produce malformed SQL.
      # --set=ON_ERROR_STOP=1: any SQL failure immediately stops psql with non-zero exit,
      #   so this CI step fails loudly instead of silently swallowing errors.
      - name: Initialize RDS roles and schemas
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        env:
          PGPASSWORD: ${{ secrets.RDS_ADMIN_PASSWORD }}
          PGSSLMODE: require
          RDS_HOST: ${{ secrets.RDS_HOST }}
          RDS_PORT: ${{ secrets.RDS_PORT }}
          RDS_ADMIN_USER: ${{ secrets.RDS_ADMIN_USER }}
          DB_NAME: ${{ secrets.DB_NAME }}
          APP_DB_USER: ${{ secrets.APP_DB_USER }}
          APP_DB_PASSWORD: ${{ secrets.APP_DB_PASSWORD }}
          MESSAGING_DB_USER: ${{ secrets.MESSAGING_DB_USER }}
          MESSAGING_DB_PASSWORD: ${{ secrets.MESSAGING_DB_PASSWORD }}
          MESSAGING_DB_SCHEMA: ${{ secrets.MESSAGING_DB_SCHEMA }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: PGPASSWORD,PGSSLMODE,RDS_HOST,RDS_PORT,RDS_ADMIN_USER,DB_NAME,APP_DB_USER,APP_DB_PASSWORD,MESSAGING_DB_USER,MESSAGING_DB_PASSWORD,MESSAGING_DB_SCHEMA
          script: |
            set -euo pipefail
            # :'varname' is psql's quoted-literal substitution: psql escapes the value
            # and wraps it in single quotes before sending SQL to PG, preventing injection
            # if the password contains single quotes, backslashes, or semicolons.
            psql \
              -h "$RDS_HOST" \
              -p "$RDS_PORT" \
              -U "$RDS_ADMIN_USER" \
              -d "$DB_NAME" \
              --set=ON_ERROR_STOP=1 \
              -v app_pw="$APP_DB_PASSWORD" \
              -v msg_pw="$MESSAGING_DB_PASSWORD" \
              -c "DO \$\$ BEGIN IF NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = '${APP_DB_USER}') THEN CREATE ROLE ${APP_DB_USER} WITH LOGIN PASSWORD :'app_pw'; END IF; END \$\$;" \
              -c "ALTER ROLE ${APP_DB_USER} SET search_path TO public;" \
              -c "GRANT ALL PRIVILEGES ON SCHEMA public TO ${APP_DB_USER};" \
              -c "DO \$\$ BEGIN IF NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = '${MESSAGING_DB_USER}') THEN CREATE ROLE ${MESSAGING_DB_USER} WITH LOGIN PASSWORD :'msg_pw'; END IF; END \$\$;" \
              -c "CREATE SCHEMA IF NOT EXISTS ${MESSAGING_DB_SCHEMA};" \
              -c "CREATE EXTENSION IF NOT EXISTS pg_trgm;" \
              -c "CREATE EXTENSION IF NOT EXISTS vector;" \
              -c "GRANT ALL PRIVILEGES ON SCHEMA ${MESSAGING_DB_SCHEMA} TO ${MESSAGING_DB_USER};" \
              -c "ALTER ROLE ${MESSAGING_DB_USER} SET search_path TO ${MESSAGING_DB_SCHEMA}, public;" \
              -c "GRANT USAGE ON SCHEMA public TO ${MESSAGING_DB_USER};"

      # ── Run Alembic Migrations (App User via EC2) ───────────────────────
      # docker run executes on EC2 so the container reaches RDS inside the VPC.
      # ECR token is forwarded from the runner — no aws CLI needed on EC2.
      #
      # TODO(follow-up): add downgrade round-trip test in CI before promoting to prod:
      #   alembic upgrade head && alembic downgrade -1 && alembic upgrade head
      #   Run against an ephemeral RDS clone or a local pg container seeded from a snapshot.

      - name: Validate pending migrations
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_PASSWORD: ${{ steps.ecr-token.outputs.password }}
          APP_DB_USER: ${{ secrets.APP_DB_USER }}
          APP_DB_PASSWORD: ${{ secrets.APP_DB_PASSWORD }}
          RDS_HOST: ${{ secrets.RDS_HOST }}
          RDS_PORT: ${{ secrets.RDS_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: ECR_REGISTRY,ECR_PASSWORD,APP_DB_USER,APP_DB_PASSWORD,RDS_HOST,RDS_PORT,DB_NAME
          script: |
            echo "$ECR_PASSWORD" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
            docker run --rm \
              -e DB_USER="$APP_DB_USER" \
              -e DB_PASSWORD="$APP_DB_PASSWORD" \
              -e DB_HOST="$RDS_HOST" \
              -e DB_PORT="$RDS_PORT" \
              -e DB_NAME="$DB_NAME" \
              "$ECR_REGISTRY/petrcollect-backend:latest" \
              bash -euo pipefail -c '
                set -euo pipefail

                # Identify pending revisions (those listed after the current head marker).
                # alembic history --indicate-current marks the applied head with "(head)";
                # revisions printed after it (i.e. not yet applied) are the pending ones.
                PENDING=$(alembic history --indicate-current 2>/dev/null \
                  | awk "found{print \$1} /\(head\)/{found=1}")

                if [ -z "$PENDING" ]; then
                  echo "No pending migrations — pre-flight check passed."
                  exit 0
                fi

                FAILED=0
                for REV in $PENDING; do
                  FILE=$(find alembic/versions -maxdepth 1 -name "${REV}_*.py" 2>/dev/null | head -1)
                  if [ -z "$FILE" ]; then
                    echo "WARNING: migration file for revision $REV not found in alembic/versions/"
                    continue
                  fi

                  # Non-concurrent index creation locks the table for the full build duration.
                  if grep -qiE "create_index\b" "$FILE" && ! grep -qiE "postgresql_concurrently\s*=\s*True" "$FILE"; then
                    echo "ERROR: $FILE — create_index() without postgresql_concurrently=True locks the table in production."
                    FAILED=1
                  fi

                  # DML without a WHERE clause risks a full-table write (large backfill = long lock).
                  if grep -qiE "^\s*(op\.execute|connection\.execute).*\b(UPDATE|DELETE)\b" "$FILE" \
                     && ! grep -qiE "\bWHERE\b" "$FILE"; then
                    echo "ERROR: $FILE — UPDATE or DELETE without a WHERE clause detected."
                    FAILED=1
                  fi

                  # Adding a NOT NULL column without a server-side default locks the table for a full rewrite.
                  if grep -qiE "add_column" "$FILE" \
                     && grep -qiE "nullable\s*=\s*False" "$FILE" \
                     && ! grep -qiE "server_default" "$FILE"; then
                    echo "ERROR: $FILE — NOT NULL column added without server_default; locks table on large datasets."
                    FAILED=1
                  fi
                done

                if [ "$FAILED" -ne 0 ]; then
                  echo "Migration pre-flight check FAILED — aborting deployment."
                  exit 1
                fi

                echo "Migration pre-flight check passed."
              '

      - name: Run Backend Migrations
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_PASSWORD: ${{ steps.ecr-token.outputs.password }}
          APP_DB_USER: ${{ secrets.APP_DB_USER }}
          APP_DB_PASSWORD: ${{ secrets.APP_DB_PASSWORD }}
          RDS_HOST: ${{ secrets.RDS_HOST }}
          RDS_PORT: ${{ secrets.RDS_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: ECR_REGISTRY,ECR_PASSWORD,APP_DB_USER,APP_DB_PASSWORD,RDS_HOST,RDS_PORT,DB_NAME
          script: |
            echo "$ECR_PASSWORD" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
            docker run --rm \
              -e DB_USER="$APP_DB_USER" \
              -e DB_PASSWORD="$APP_DB_PASSWORD" \
              -e DB_HOST="$RDS_HOST" \
              -e DB_PORT="$RDS_PORT" \
              -e DB_NAME="$DB_NAME" \
              "$ECR_REGISTRY/petrcollect-backend:latest" \
              alembic upgrade head

      # ── Cross-Schema Permissions (Admin via EC2) ────────────────────────
      # Grants messaging user read access to public.users.
      # Must run after Alembic has created the table.
      - name: Grant Cross-Schema Permissions
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        env:
          PGPASSWORD: ${{ secrets.RDS_ADMIN_PASSWORD }}
          PGSSLMODE: require
          RDS_HOST: ${{ secrets.RDS_HOST }}
          RDS_PORT: ${{ secrets.RDS_PORT }}
          RDS_ADMIN_USER: ${{ secrets.RDS_ADMIN_USER }}
          DB_NAME: ${{ secrets.DB_NAME }}
          MESSAGING_DB_USER: ${{ secrets.MESSAGING_DB_USER }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: PGPASSWORD,PGSSLMODE,RDS_HOST,RDS_PORT,RDS_ADMIN_USER,DB_NAME,MESSAGING_DB_USER
          script: |
            psql \
              -h "$RDS_HOST" \
              -p "$RDS_PORT" \
              -U "$RDS_ADMIN_USER" \
              -d "$DB_NAME" \
              -c "GRANT SELECT ON public.users TO ${MESSAGING_DB_USER};"

      # ── Prepare EC2 Directory ────────────────────────────────────────────
      - name: Prepare EC2 Directory
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: mkdir -p ~/petrcollect

      # ── Create .env for EC2 ──────────────────────────────────────────────
      # TODO(security): migrate to AWS Secrets Manager
      # Current: secrets written to .env on EC2 disk (chmod 600)
      # Goal: replace with `aws secretsmanager get-secret-value` at container startup
      # Requires: secrets pre-created in Secrets Manager and IAM role with secretsmanager:GetSecretValue
      # See: docs/DECISION_LOG.md — Secrets Management Migration
      #
      # RDS_ADMIN_PASSWORD is intentionally omitted — admin creds are only
      # needed for the one-time schema init steps above, not at runtime.
      - name: Create .env file for EC2
        run: |
          echo "ECR_REGISTRY=${{ steps.login-ecr.outputs.registry }}" > .env
          echo "DB_HOST=${{ secrets.RDS_HOST }}" >> .env
          echo "DB_PORT=${{ secrets.RDS_PORT }}" >> .env
          echo "DB_NAME=${{ secrets.DB_NAME }}" >> .env
          echo "APP_DB_USER=${{ secrets.APP_DB_USER }}" >> .env
          echo "APP_DB_PASSWORD=${{ secrets.APP_DB_PASSWORD }}" >> .env
          echo "MESSAGING_DB_USER=${{ secrets.MESSAGING_DB_USER }}" >> .env
          echo "MESSAGING_DB_PASSWORD=${{ secrets.MESSAGING_DB_PASSWORD }}" >> .env
          echo "MESSAGING_DB_SCHEMA=${{ secrets.MESSAGING_DB_SCHEMA }}" >> .env
          echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env
          echo "INTERNAL_SERVICE_SECRET=${{ secrets.INTERNAL_SERVICE_SECRET }}" >> .env
          echo "AWS_REGION=${{ secrets.AWS_REGION }}" >> .env
          echo "AWS_S3_BUCKET=${{ secrets.AWS_S3_BUCKET }}" >> .env
          echo "CLOUDFRONT_DOMAIN=${{ secrets.CLOUDFRONT_DOMAIN }}" >> .env
          echo "ALLOWED_ORIGINS=${{ secrets.ALLOWED_ORIGINS }}" >> .env
          echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" >> .env
          echo "GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}" >> .env
          echo "GOOGLE_REDIRECT_URI=${{ secrets.GOOGLE_REDIRECT_URI }}" >> .env
          echo "COOKIE_SECURE=true" >> .env

      # ── Copy configuration to EC2 ────────────────────────────────────────
      - name: Copy docker-compose and .env to EC2
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634 # v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.prod.yml,.env"
          target: "~/petrcollect/"

      # ── Deploy to EC2 ────────────────────────────────────────────────────
      - name: Deploy to EC2
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_PASSWORD: ${{ steps.ecr-token.outputs.password }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: ECR_REGISTRY,ECR_PASSWORD
          script: |
            chmod 600 ~/petrcollect/.env
            cd ~/petrcollect

            # Login to ECR on EC2
            echo "$ECR_PASSWORD" | docker login --username AWS --password-stdin "$ECR_REGISTRY"

            # Pull latest images
            docker pull "$ECR_REGISTRY/petrcollect-backend:latest"
            docker pull "$ECR_REGISTRY/petrcollect-messaging:latest"

            # Tear down first (removes orphan containers from old naming schemes that cause name conflicts)
            docker compose -f docker-compose.prod.yml down --remove-orphans

            # Restart services — force-recreate ensures the freshly pulled image is always used
            docker compose -f docker-compose.prod.yml up -d --force-recreate

            # Remove images no longer referenced by any container to prevent disk exhaustion.
            # || true: a concurrent prune (e.g. from the Alembic docker run --rm step) must
            # not fail the pipeline — containers are already running at this point.
            docker image prune -a -f || true
