services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: antcollect_test
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    image: petrcollect-backend:ci
    ports:
      - "8000:8000"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: antcollect_test
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET}
      MESSAGING_INTERNAL_URL: http://messaging:8080
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      # OIDC injects these into the runner environment; Compose reads them through.
      # No LocalStack — E2E uses the real S3 bucket via temporary OIDC credentials.
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      AWS_REGION: ${AWS_REGION}
      CLOUDFRONT_DOMAIN: ${CLOUDFRONT_DOMAIN}
    depends_on:
      postgres:
        condition: service_healthy

  messaging:
    image: petrcollect-messaging:ci
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/antcollect_test
      SPRING_DATASOURCE_USERNAME: ${MESSAGING_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${MESSAGING_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
    depends_on:
      postgres:
        condition: service_healthy
