<text x="48" y="456" font-family="Bricolage Grotesque" font-size="18" font-weight="700" fill="#332D2A">Type</text>
<text x="48" y="494" font-family="Bricolage Grotesque" font-size="22" font-weight="700" fill="#332D2A">Bricolage Grotesque 700 / 22 — display</text>
