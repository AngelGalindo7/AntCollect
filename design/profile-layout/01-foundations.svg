<rect x="664" y="476" width="120" height="80" rx="40" fill="#FAF8F4" stroke="#DDD4C5" stroke-width="1" id="radius-full-pill"/>
<text x="664" y="574" font-family="Inter Tight" font-size="12" font-weight="400" fill="#332D2A" fill-opacity="0.6">full — pills &amp; chips</text>
<text x="48" y="636" font-family="Bricolage Grotesque" font-size="18" font-weight="700" fill="#332D2A">Placeholder sticker art — on-brand only</text>
<text x="48" y="658" font-family="Inter Tight" font-size="12" font-weight="400" fill="#332D2A" fill-opacity="0.6">Retired: #2E7D5B (off-palette green), #12345f (stray navy). Brand hexes at varied opacity replace them — no invented hues.</text>
