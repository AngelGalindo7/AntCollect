  <text x="228" y="232" font-family="Inter Tight" font-size="13" font-weight="400" fill="#332D2A" fill-opacity="0.4">·</text>
  <text x="240" y="232" font-family="Inter Tight" font-size="13" font-weight="700" fill="#332D2A">6</text>
  <text x="252" y="232" font-family="Inter Tight" font-size="13" font-weight="400" fill="#332D2A" fill-opacity="0.6">Folders</text>
</g>
