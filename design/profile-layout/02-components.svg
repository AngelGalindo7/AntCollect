</g>
<text x="500" y="690" font-family="Inter Tight" font-size="12" font-weight="400" fill="#332D2A" fill-opacity="0.6">Keep at top-right. This is why the profile</text>
<text x="500" y="707" font-family="Inter Tight" font-size="12" font-weight="400" fill="#332D2A" fill-opacity="0.6">chip must not live in that corner.</text>
<text x="500" y="756" font-family="Bricolage Grotesque" font-size="15" font-weight="700" fill="#332D2A">Avatar semantics — the two are different people</text>
<circle cx="516" cy="800" r="16" fill="#FFD200" id="rail-chip-your-account"/>
<text x="516" y="805" font-family="Inter Tight" font-size="11" font-weight="700" fill="#332D2A" text-anchor="middle">AG</text>
<text x="544" y="798" font-family="Inter Tight" font-size="12" font-weight="400" fill="#332D2A" fill-opacity="0.7">Rail chip = your account (SideBar.tsx:237)</text>
<text x="544" y="815" font-family="Inter Tight" font-size="11" font-weight="400" fill="#332D2A" fill-opacity="0.5">nav affordance, follows you everywhere</text>
<circle cx="516" cy="858" r="16" fill="#F4EFE6" stroke="#FFFFFF" stroke-width="2" id="identity-avatar-viewed-user"/>
<text x="516" y="863" font-family="Bricolage Grotesque" font-size="13" font-weight="600" fill="#332D2A" fill-opacity="0.55" text-anchor="middle">A</text>
<text x="544" y="856" font-family="Inter Tight" font-size="12" font-weight="400" fill="#332D2A" fill-opacity="0.7">Identity avatar = the profile you're viewing</text>
<text x="544" y="873" font-family="Inter Tight" font-size="11" font-weight="400" fill="#332D2A" fill-opacity="0.5">page content, changes per route</text>
</svg>
