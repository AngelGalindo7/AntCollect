  <text x="455.5" y="536" font-family="Inter Tight" font-size="11" font-weight="600" fill="#332D2A" fill-opacity="0.35" text-anchor="middle">0</text>
  <rect x="487" y="514" width="114" height="36" rx="18" fill="#FAF8F4" stroke="#DDD4C5" stroke-width="1" id="pill-showcase"/>
  <text x="503" y="537" font-family="Inter Tight" font-size="14" font-weight="500" fill="#332D2A" fill-opacity="0.45">Showcase</text>
