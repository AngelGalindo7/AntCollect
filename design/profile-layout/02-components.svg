  <text x="579.5" y="536" font-family="Inter Tight" font-size="11" font-weight="600" fill="#332D2A" fill-opacity="0.35" text-anchor="middle">0</text>
</g>
<text x="48" y="604" font-family="Bricolage Grotesque" font-size="15" font-weight="700" fill="#332D2A">Sticker card / add tile</text>
<g id="sticker-card-default">
