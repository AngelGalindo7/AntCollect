</g>
<text x="88" y="494" font-family="Inter Tight" font-size="13" font-weight="400" fill="#332D2A" fill-opacity="0.6">Cards keep their intrinsic width — no stretch-to-fill. Trailing add tile gives the row a terminator.</text>
<g id="sparse-nudge">
  <rect x="88" y="528" width="604" height="92" rx="14" fill="#FAF8F4" stroke="#DDD4C5" stroke-width="1"/>
  <rect x="88" y="528" width="4" height="92" rx="2" fill="#FFD200"/>
  <text x="112" y="560" font-family="Bricolage Grotesque" font-size="15" font-weight="700" fill="#332D2A">Your collection is just getting started</text>
  <text x="112" y="583" font-family="Inter Tight" font-size="13" font-weight="400" fill="#332D2A" fill-opacity="0.65">Add stickers to Looking For so traders know what you're after.</text>
  <rect x="112" y="596" width="150" height="32" rx="16" fill="#0064A4"/>
  <text x="187" y="617" font-family="Inter Tight" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">Set up Looking For</text>
</g>
<text x="88" y="992" font-family="Inter Tight" font-size="12" font-weight="400" fill="#332D2A" fill-opacity="0.5">B — Sparse (4 items). The identity row is the reason this page still has a subject; a 32px chip alone would leave it empty.</text>
</svg>
