# Project name is pinned so the compose network is deterministically
# "petrcollect_default" — the CD's one-off `docker run` for Alembic joins it by
# name and cannot resolve `db` otherwise.
name: petrcollect

services:
  db:
    # pgvector, not plain postgres:16 — migration e1f2a3b4c5d6 adds a
    # vector(512) column and CREATE EXTENSION vector fails on the stock image.
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${POSTGRES_ADMIN_USER}
      - POSTGRES_PASSWORD=${POSTGRES_ADMIN_PASSWORD}
    # /data is the separate EBS volume with DeleteOnTermination off, so the
    # database survives instance replacement. No ports published — the backend
    # reaches it over the compose network.
    volumes:
      - /data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ADMIN_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 12
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION}
        awslogs-group: /petrcollect/db
        awslogs-stream: production
        awslogs-create-group: "true"
    restart: unless-stopped

  backend:
    image: ${ECR_REGISTRY}/petrcollect-backend:latest
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME}
      - DB_USER=${APP_DB_USER}
      - DB_PASSWORD=${APP_DB_PASSWORD}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET}
      - AWS_REGION=${AWS_REGION}
      - CLOUDFRONT_DOMAIN=${CLOUDFRONT_DOMAIN}
      - REMOVE_BG_ALLOWED_HOSTS=${REMOVE_BG_ALLOWED_HOSTS}
      - JWT_SECRET=${JWT_SECRET}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - HTTPS_ENABLED=true
      - BEHIND_PROXY=true
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI}
      - COOKIE_SECURE=true
      - COOKIE_DOMAIN=${COOKIE_DOMAIN}
      - LOG_LEVEL=INFO
      - SLOW_REQUEST_MS=500
      - SLOW_QUERY_MS=100
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION}
        awslogs-group: /petrcollect/backend
        awslogs-stream: production
        awslogs-create-group: "true"
    restart: unless-stopped

