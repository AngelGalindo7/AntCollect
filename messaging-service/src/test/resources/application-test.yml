MESSAGING_DB_SCHEMA: petrcollect_messaging

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/antcollect_test
    username: ${MESSAGING_DB_USER:testuser}
    password: ${MESSAGING_DB_PASSWORD:testpassword}
  jpa:
    properties:
      hibernate:
        default_schema: petrcollect_messaging
  flyway:
    locations: classpath:db/migration,classpath:db/testdata
    default-schema: petrcollect_messaging

app:
  jwt:
    # Fixed test-only secret — never read from JWT_SECRET env var.
    # Must be >= 32 bytes (256 bits) for JJWT 0.12.x / RFC 7518 HS256 — changing this value must meet that minimum or JJWT throws WeakKeyException.
    secret: "test-secret-key-for-unit-tests-only-not-for-prod"
  internal:
    secret: ${INTERNAL_SERVICE_SECRET:test-internal-secret-for-unit-tests-only}
