spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/antcollect_test
    username: ${MESSAGING_DB_USER:testuser}
    password: ${MESSAGING_DB_PASSWORD:testpassword}

app:
  jwt:
    # Falls back to a fixed test-only secret when JWT_SECRET is not in the environment.
    # Production always requires the env var (no default in application.yml).
    secret: ${JWT_SECRET:test-secret-key-for-unit-tests-only-not-for-prod}
