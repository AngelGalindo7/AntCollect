spring:
  config:
    import: optional:file:../.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:5432/antcollect_local
    username: ${MESSAGING_DB_USER}
    password: ${MESSAGING_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: ${MESSAGING_DB_SCHEMA}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    default-schema: ${MESSAGING_DB_SCHEMA}

app:
  jwt:
    secret: ${JWT_SECRET}
    algorithm: HS256
    expiration: 1200
  internal:
    secret: ${INTERNAL_SERVICE_SECRET}
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173}
logging:
  level:
    com.petrcollect.messaging: DEBUG
    org.springframework.web: DEBUG
server:
  error:
    include-message: never
    include-stacktrace: never
